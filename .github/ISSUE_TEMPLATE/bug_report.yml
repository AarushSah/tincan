name: Bug report
description: Something in tincan doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste real messages, names, phone numbers, emails, contact ids or chat ids**, yours or anyone else's. Output of `chats`, `read`, `who`, `inbox`, `search`, `watch`, `calls`, `contacts` and `doctor` on your Mac contains them. Reproduce on the [fixture world](https://github.com/AarushSah/tincan/blob/main/docs/development.md#run-tincan-on-invented-data) where you can, or replace every personal detail with invented ones such as Maya Chen, `+14155550142` and `maya@example.com`.

        A way to leak data, get around an exclusion, send to the wrong person or inject commands is a security problem: report it privately as [SECURITY.md](https://github.com/AarushSah/tincan/blob/main/SECURITY.md) describes, not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did and what tincan did, including the exit status (`echo $?`).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands, with invented names and numbers.
      render: shell
  - type: input
    id: version
    attributes:
      label: tincan version
      description: Output of `tincan --version`.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: Output of `sw_vers -productVersion`.
      placeholder: "26.0"
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: tincan doctor --json
      description: >-
        Output of `tincan doctor --json` with personal data removed: replace your
        Messages addresses with invented ones, and your user name in paths with `<user>`.
      render: json
  - type: checkboxes
    id: privacy
    attributes:
      label: Personal data
      options:
        - label: This report contains no real messages, names, numbers, emails or ids.
          required: true
